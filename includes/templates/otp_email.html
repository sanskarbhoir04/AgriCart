<!DOCTYPE html>
<html lang="{{LANG_ATTR}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{HEADING}}</title>
<!--[if mso]>
<style type="text/css">
  body, table, td { font-family: Arial, Helvetica, sans-serif !important; }
</style>
<![endif]-->
<style>
  @media only screen and (max-width: 600px) {
    .agri-card { width: 100% !important; border-radius: 0 !important; }
    .agri-pad { padding-left: 24px !important; padding-right: 24px !important; }
    .agri-otp { font-size: 32px !important; letter-spacing: 6px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#F4F6F5;-webkit-text-size-adjust:100%;text-size-adjust:100%;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{HEADING}} — {{OTP}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F4F6F5;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" class="agri-card" width="560" cellpadding="0" cellspacing="0" style="width:560px;max-width:560px;background-color:#FFFFFF;border-radius:12px;border:1px solid #ECEFEC;box-shadow:0 4px 24px rgba(20,40,20,0.06);overflow:hidden;">

        <!-- Logo -->
        <tr>
          <td align="center" style="padding:40px 40px 16px;">
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
              <tr>
                <td style="vertical-align:middle;padding-right:12px;">
                  <img src="cid:{{LOGO_CID}}" width="56" height="56" alt="AgriCart" style="display:block;border-radius:50%;border:0;outline:none;">
                </td>
                <td style="vertical-align:middle;">
                  <span style="font-family:'Poppins','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:26px;font-weight:800;letter-spacing:-0.4px;">
                    <span style="color:#16281B;">Agri</span><span style="color:#2E7D32;">Cart</span>
                  </span>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Heading -->
        <tr>
          <td align="center" class="agri-pad" style="padding:0 40px;">
            <h1 style="margin:0 0 18px;font-family:'Poppins','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:24px;line-height:1.3;font-weight:700;color:#16281B;letter-spacing:-0.3px;">{{HEADING}}</h1>
          </td>
        </tr>

        <!-- Greeting + message -->
        <tr>
          <td class="agri-pad" style="padding:0 40px;">
            <p style="margin:0 0 14px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#2B342E;">Hello {{USER_NAME}},</p>
            <p style="margin:0 0 30px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.7;color:#5B685F;">{{INTRO_MSG}}</p>
          </td>
        </tr>

        <!-- OTP box -->
        <tr>
          <td align="center" class="agri-pad" style="padding:0 40px 8px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" style="background-color:#EAF6EC;border:1px solid #BEE3C2;border-radius:12px;padding:26px 20px;">
                  <span class="agri-otp" style="display:block;font-family:'Courier New',Consolas,monospace;font-size:40px;font-weight:800;letter-spacing:10px;color:#2E7D32;">{{OTP}}</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Notes -->
        <tr>
          <td class="agri-pad" style="padding:22px 40px 8px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding:0 0 10px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.6;color:#5B685F;">
                  <span style="color:#2E7D32;font-weight:700;">•</span>&nbsp; {{NOTE_EXPIRY}}
                </td>
              </tr>
              <tr>
                <td style="padding:0 0 10px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.6;color:#8A3A32;background-color:#FBF0EE;border-radius:8px;padding:10px 12px;">
                  <span style="font-weight:700;">•</span>&nbsp; {{NOTE_SHARE}}
                </td>
              </tr>
              <tr>
                <td style="padding:10px 0 0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.6;color:#8B968E;">
                  {{NOTE_IGNORE}}
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Divider -->
        <tr>
          <td class="agri-pad" style="padding:28px 40px 0;">
            <div style="height:1px;line-height:1px;background-color:#EDF1ED;">&nbsp;</div>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td align="center" class="agri-pad" style="padding:24px 40px 36px;">
            <p style="margin:0 0 4px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#9AA69D;">&copy; {{CURRENT_YEAR}} AgriCart. All Rights Reserved.</p>
            <p style="margin:0 0 14px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#9AA69D;">{{FOOTER_TAGLINE}}</p>
            <p style="margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.8;color:#B7C0B9;">
              <a href="mailto:{{SUPPORT_EMAIL}}" style="color:#2E7D32;text-decoration:none;">{{SUPPORT_EMAIL}}</a>
              &nbsp;&nbsp;•&nbsp;&nbsp;
              <a href="{{WEBSITE_URL}}" style="color:#2E7D32;text-decoration:none;">{{WEBSITE_URL_LABEL}}</a>
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
